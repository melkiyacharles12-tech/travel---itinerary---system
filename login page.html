<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploraa ✈ | Login & Sign Up</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #7a1f4b, #a15dc0);
    color: #2c003e;
    height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  
  .sticker {
    position: absolute;
    opacity: 0.08;
    width: 90px;
    height: 90px;
    z-index: 0;
    animation: float 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 50px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    z-index: 5;
  }
  nav h1 { color: #d63384; font-size: 22px; font-weight: 700; }
  nav ul { list-style: none; display: flex; gap: 20px; }
  nav ul li a {
    text-decoration: none; font-weight: 600; color: #2c003e; transition: 0.3s;
  }
  nav ul li a:hover { color: #d63384; }

  
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 50px;
    z-index: 2;
    padding: 20px 40px;
  }

  .container {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 30px 25px;
    width: 350px;
    max-width: 100%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  .container h2 {
    color: #c21873;
    font-size: 22px;
    margin-bottom: 18px;
    font-weight: 700;
  }

  .container input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 14px;
    outline: none;
  }

  .container button {
    padding: 12px 0;
    margin-top: 15px;
    background: linear-gradient(90deg, #ff6f91, #ff4f79);
    border: none;
    color: #fff;
    border-radius: 30px;
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s ease;
  }
  .container button:hover {
    transform: scale(1.05);
    background: linear-gradient(90deg, #ff4f79, #ff6f91);
  }

  footer {
    text-align: center;
    padding: 12px;
    background: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    z-index: 5;
  }
  footer a { color: #c21873; font-weight: bold; text-decoration: none; }
</style>
</head>
<body>


<img src="https://img.icons8.com/color/96/airplane-take-off.png" class="sticker" style="top:8%; left:10%;">
<img src="https://img.icons8.com/color/96/suitcase.png" class="sticker" style="top:18%; right:12%;">
<img src="https://img.icons8.com/color/96/globe.png" class="sticker" style="top:40%; left:50%;">
<img src="https://img.icons8.com/color/96/camera.png" class="sticker" style="bottom:10%; right:15%;">


<nav>
  <h1>Exploraa ✈</h1>
  <ul>
    <li><a href="home2.html">Home</a></li>
    <li><a href="plannerpage.html">Plan a Trip</a></li>
    <li><a href="bookingpage.html">Bookings</a></li>
    <li><a href="about_contact.html">About & Contact</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
</nav>

<main>
  
  <div class="container">
    <h2>Login 🔑</h2>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button onclick="window.location.href='home2.html'">Login</button>
  </div>

  
  <div class="container">
    <h2>Sign Up 📝</h2>
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button onclick="window.location.href='home2.html'">Sign Up</button>
  </div>
</main>

<footer>
  <p>Made with 💕 for travelers</p>
  <p><a href="home2.html">Home</a> | <a href="plannerpage.html">Plan a Trip</a></p>
</footer>

</body>
</html>
